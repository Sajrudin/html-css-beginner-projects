<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoe Website</title>
</head>
<body>
    <main>
        <aside class="side-bar">
            <img src="./images/side_image1.png" alt="Shoe" class="side_image">
            <img src="./images/side_image2.png" alt="Shoe" class="side_image">
            <img src="./images/side_image3.png" alt="Shoe" class="side_image">
            <img src="./images/side_image4.png" alt="Shoe" class="side_image">
            <img src="./images/side_image5.png" alt="Shoe" class="side_image">
            <img src="./images/side_image6.png" alt="Shoe" class="side_image">
        </aside>
        <section class="center-content">
            <img src="./images/center_image.png" alt="Green Shoe" class="center-img">
        </section>
        <section class="discription">
            <h2>Sustainable Materials</h2>
            <h1>Nike Revolution 8</h1>
            <p class="tagline">Men's Road Running Shoes</p>
            <p class="price">MRP - $12.00</p>
            <p class="price-description">Inlcusive of all taxes</p>
            <p class="price-description">Also includes all applicable duties</p>

            <figure class="shoe-variant">
                <img src="./images/variant1.png" alt="Green Shoe" class="shoe-options">
                <img src="./images/variant2.png" alt="Black Shoe" class="shoe-options">
                <img src="./images/variant3.png" alt="Pink Shoe" class="shoe-options">
                <img src="./images/variant4.png" alt="Grey Shoe" class="shoe-options">
            </figure>

            <table class="size-chart">
                <tr>
                    <th>Select Size</th>
                    <th>Size Guide</th>
                </tr>
                <tr>
                    <td>UK 6</td>
                    <td>UK 6.6</td>
                </tr>
                <tr>
                    <td>UK 7</td>
                    <td>UK 7.5</td>
                </tr>
            </table>

            <button class="add-to-cart">Add to Cart</button>
            <button class="favourite">Favourite</button>
        </section>
    </main>
    
</body>
</html>
