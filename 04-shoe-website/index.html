<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shoe Website</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <aside class="side-bar">
        <img src="./images/side_image1.png" alt="Shoe" class="side-image" />
        <img src="./images/side_image5.png" alt="Shoe" class="side-image" />
        <img src="./images/side_image3.png" alt="Shoe" class="side-image" />
        <img src="./images/side_image6.png" alt="Shoe" class="side-image" />
        <img src="./images/side_image4.png" alt="Shoe" class="side-image" />
        <img src="./images/side_image2.png" alt="Shoe" class="side-image" />
      </aside>
      <section class="center-content">
        <img
          src="./images/center_image.png"
          alt="Green Shoe"
          class="center-img"
        />
      </section>
      <section class="description">
        <article>
          <h2>Sustainable Materials</h2>
          <h1>Nike Revolution 8</h1>
          <p class="tagline">Men's Road Running Shoes</p>
          <p class="price">MRP - $12.00</p>
          <p class="price-description">Inlcusive of all taxes</p>
          <p class="price-description">Also includes all applicable duties</p>
        </article>
        <figure class="shoe-variant">
          <img
            src="./images/variant1.png"
            alt="Green Shoe"
            class="shoe-options"
          />
          <img
            src="./images/variant2.png"
            alt="Black Shoe"
            class="shoe-options"
          />
          <img
            src="./images/variant3.png"
            alt="Pink Shoe"
            class="shoe-options"
          />
          <img
            src="./images/variant4.png"
            alt="Grey Shoe"
            class="shoe-options"
          />
        </figure>

        <div class="size-chart">
            <div class="size-head">Select Size</div>
            <div class="size-head">Size Guide</div>
            <div class="sizes">UK 6</div>
            <div class="sizes">UK 6.6</div>
            <div class="sizes">UK 7</div>
            <div class="sizes">UK 7.5</div>
        </div>

        <button class="add-to-cart">Add to Cart</button>
        <button class="favourite">Favourite</button>
      </section>
    </main>
  </body>
</html>
