<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Food Banner</title>
  </head>

  <body>
    <main>
      <div class="image_container">
        <img src="./images/bg_image.png" alt="background image" />
      </div>

      <div class="content">
        <img src="./images/burger.png" alt="Burger" class="burger" />
        <img src="./images/tomato.png" alt="Tomato" class="tomato-1" />
        <img src="./images/tomato.png" alt="tomato" class="tomato-2" />
        <img src="./images/pizza.png" alt="pizza" class="pizza" />
        <img src="./images/momo.png" alt="momo" class="momo" />
        <img src="./images/leaf.png" alt="leaf" class="leaf" />

        <div class="center-content">
          <section class="text-content">
            <h1>
              Better Food <br />
              for more people
            </h1>
            <p>
              For over a decade we have enabled our customers to discover new
              tastes, deliver right to their doorstep.
            </p>
          </section>

          <section class="info-section">
            <div class="info-item">
              <img
                src="./images/house.png"
                alt="Restaurant Icon"
                class="info-icon"
              />
              <div class="info-text">
                <span class="info-number">3,00,000+</span>
                <span class="info-label">Restaurant</span>
              </div>
            </div>

            <div class="info-item">
              <img
                src="./images/location.png"
                alt="Location"
                class="info-icon"
              />
              <div class="info-text">
                <span class="info-number">800+</span>
                <span class="info-label">Cities</span>
              </div>
            </div>
            <div class="info-item">
              <img src="./images/banner.png" alt="Banner" class="info-icon" />
              <div class="info-text">
                <span class="info-number">3 billion+</span>
                <span class="info-label">orders dilevered</span>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
